; Sparse UI hints for the AI assistant. Do not restate BJS titles/fields/tab trees.
; Section = full Pman.Dialog.* / Pman.Tab.* name from the .bjs "name" property.

; --- Staff vs contacts vs companies ---

[Pman.Dialog.AdminPerson]
_description = "Create or edit a staff login (core_person). Not CRM contacts (CrmPerson) and not CorePersonContact. Staff list is Administration → Staff Manager (PersonStaff; no BJS catalog entry — search core_person with query[person_internal_only_all]=1). Create with args { id: 0 }; extra tabs appear only after the first Save. Prefill known name/email/role/phone/office in changes. Groups are assigned on the Groups tab (persisted as group_ids)."
_args = "{ id: core_person id; 0 to create }"
_showExample = "show_dialog({ name: 'AdminPerson', args: { id: 0 }, changes: { name: 'Jane Doe', email: 'jane@example.com' }, wait: true })"
company_id = "Owning company. On create, defaults to the logged-in user's company — leave unless creating staff for another company."
office_id = "Department / office. Combo is filtered by company_id; company must be set first."
passwd1 = "Optional on edit. Required when sending intro mail, or when creating the first admin account. Must match passwd2."
passwd2 = "Confirm passwd1. Both blank = leave password unchanged on edit."
group_ids = "Comma-separated core_group ids. The Groups tab grid writes this on Save; pass in changes only when the ids are already known. Groups tab is hidden until id > 0."
secure_password = "1 = enforce a strong passwd1 (default on). 0 = allow a weaker password."
/groups = "Permission-group membership for this staff account (checkbox grid; saved as group_ids). Hidden until the person exists."
/system-settings = "Read-only core_person_settings for this user. Not for login or password."
/user-sessions = "Active login sessions; can force logout. Hidden until the person exists."
/log = "Events for this person. Hidden until the person exists."
/action = "Actions for this person. Hidden until the person exists."

[Pman.Dialog.AdminBulkPassword]
_description = "Bulk set staff passwords from a paste list. Open once; user confirms OK. Cannot change the logged-in user's password this way. For a single person use AdminPerson passwd1/passwd2 instead."
_args = "{ }"
_showExample = "show_dialog({ name: 'AdminBulkPassword', args: {}, changes: { _bulk_update_passwords: 'jane@example.com NewPass1!\nbob@example.com NewPass2!' }, wait: true })"
_bulk_update_passwords = "One person per line: email, then a space, then the new password. Prefill when the user supplied the list."

[Pman.Dialog.AdminCompanyMerge]
_description = "Merge two core_company rows: the selected company is deleted and its data is moved onto the keep company. Not CrmMergeCompany (CRM companies). Open with the company to retire; pick the keep company in _merge_id."
_args = "{ id: core_company id to delete/merge away, name }"
_showExample = "show_dialog({ name: 'AdminCompanyMerge', args: { id: 100, name: 'Old Co' }, changes: { _merge_id: 200 }, wait: true })"
id = "Company being retired (deleted after merge). Pass the selected row's id."
_merge_id = "core_company id to keep. Prefer in changes when known."

[Pman.Tab.AdminContacts]
_description = "External / client contacts on core_person (not staff logins, not CRM CrmPerson). Staff editing is AdminPerson. Row edit uses PersonEdit (JS-only, not in the catalog) — prefer CorePersonContact with args { id }. Bulk add is PersonBulkAdd (also not in the catalog)."

[Pman.Tab.AdminContactsManager]
_description = "Parent for Admin contacts: people grid plus contact groups. Not the CRM Contacts tab (CrmClient)."

[Pman.Tab.AdminContactsGroup]
_description = "core_group list used to organise Admin contacts (west of Contacts Manager). Not staff permission groups on AdminPerson / Groups."

[Pman.Tab.AdminCompanies]
_description = "core_company directory (agencies, owner org, customers). Merge is AdminCompanyMerge. Offices for the selected company are AdminOffice (south). Not CRM company merge (CrmMergeCompany)."

[Pman.Tab.AdminOffice]
_description = "Offices / departments of the company selected on AdminCompanies (south panel). Filter is the parent company row — do not open as a standalone company editor."

; --- Logs and sessions ---

[Pman.Tab.AdminLogEvents]
_description = "Admin event log grid (Events). Selecting a row loads EventView detail in the south panel. To open the same full event detail in a dialog, use CoreViewWebsite with url '/Admin/EventView/{Events.id}.html', relative: true, wait: false. For LLM usage relative must always be true; relative: false is not permitted. Event history for one record is AdminEventLog. Aggregated drilldown is AdminLogDrill. Live logins are AdminSession."

[Pman.Tab.AdminLogDrill]
_description = "Aggregated Events drilldown by action, affected table, and date range (daily summary then detail). Not the raw Events grid (AdminLogEvents) and not a single-record history (AdminEventLog)."

[Pman.Tab.AdminLogs]
_description = "Logs container. Children: AdminLogEvents (raw Events), AdminLogDrill (aggregates), AdminSession (live logins)."

[Pman.Tab.AdminSession]
_description = "Live user sessions (core_person_window); can force logout. Not event history. Per-person sessions also live on AdminPerson tab /user-sessions after the person exists."

[Pman.Dialog.AdminEventLog]
_description = "Event history grid for one record (Events filtered by on_table + on_id). Close-only — wait: false. Not the main Events tab (AdminLogEvents). For the full EventView payload of one Events.id use CoreViewWebsite."
_args = "{ on_table, on_id, person_table? }"
_showExample = "show_dialog({ name: 'AdminEventLog', args: { on_table: 'core_person', on_id: 123 }, wait: false })"
on_table = "Required. Table the events are about (e.g. core_person)."
on_id = "Required. Row id in on_table."
person_table = "Optional. When the actor is not core_person, the person table name."

; --- Pulldown enums ---

[Pman.Tab.AdminEnum]
_description = "core_enum pulldown lists: west = etype (list name), center = values for the selected etype. Add/rename a list with AdminEnumType; edit values in the center grid or AdminCoreEnum; merge two values with AdminEnumMerge; images with AdminEnumImages."

[Pman.Dialog.AdminEnumType]
_description = "Add or rename a pulldown list (core_enum etype). Title is just Edit. Pass id of the etype header row, or id 0 plus name/display_name in changes to create. Values of an existing list are edited on AdminEnum / AdminCoreEnum, not here."
_args = "{ id: core_enum header id; 0 to create }"

[Pman.Dialog.AdminCoreEnum]
_description = "Grid of values for one core_enum etype (not a single-row form). Requires args.etype. Prefer the AdminEnum tab unless you need this dialog for a known etype."
_args = "{ etype, _hide_name? }"
_showExample = "show_dialog({ name: 'AdminCoreEnum', args: { etype: 'comptype' }, wait: true })"
etype = "Required. core_enum.etype string (e.g. comptype)."
_hide_name = "If set, hides the internal Name column."

[Pman.Dialog.AdminEnumMerge]
_description = "Merge two core_enum values of the same etype. Open with the row to retire; pick the keep value in _merge_id. Not a company or CRM merge."
_args = "{ id, etype, display_name }"
_showExample = "show_dialog({ name: 'AdminEnumMerge', args: { id: 10, etype: 'comptype', display_name: 'Old' }, changes: { _merge_id: 11 }, wait: true })"
etype = "Required. Both rows must share this etype."
_merge_id = "core_enum id to keep. Prefer in changes when known."

[Pman.Dialog.AdminEnumImages]
_description = "Images attached to one core_enum value. Pass onid = that enum id. Close-only after viewing/adding — wait: false unless the user is adding."
_args = "{ onid: core_enum id }"
onid = "Required. core_enum.id whose images to manage."

; --- Domains, mail, watches ---

[Pman.Dialog.AdminDomain]
_description = "Edit a core_domain DNS/MX row (hostname, has_mx). Not a clipping/partner website — that is ClippingDomain / ClippingDomainQuickAddRss."
_args = "{ id: core_domain id; 0 to create }"

[Pman.Tab.AdminDomain]
_description = "core_domain list (DNS/MX). Editor is AdminDomain. Not clipping_domain partner sites."

[Pman.Tab.AdminEmailTemplates]
_description = "System email templates (core_email). Double-click / Add opens CoreEmail with the core_email id — do not pass module crm_mailing_list_message (that is CRM mailouts). This tab does not send mail."

[Pman.Tab.AdminWatchNotify]
_description = "Notifications parent. Children: AdminNotify (outbound queue), AdminWatches (event-triggered), AdminNotifyRecur (schedules), AdminNotifySender (from addresses)."

[Pman.Tab.AdminNotify]
_description = "Outbound notification queue (core_notify / archive). LARGE — filter by sent, act_when, person_id, or to_email. Event-triggered rules are AdminWatches; schedules are AdminNotifyRecur. Do not use this tab to compose CRM mailouts (CoreEmail + CrmMailingListQueue)."

[Pman.Tab.AdminWatches]
_description = "Event-triggered notify rules (core_watch): when an event occurs, notify a person. Editor is AdminWatch. Recurring schedules are AdminNotifyRecur; the send queue is AdminNotify."

[Pman.Dialog.AdminWatch]
_description = "Create/edit one core_watch (title in UI is Edit / Create core_watch). Event-triggered, not a recurring schedule (AdminNotifyRecur) and not a queued send (AdminNotify)."
_args = "{ id: core_watch id; 0 to create }"
event = "Trigger event name (When this occurs)."
ontable = "Optional table scope for the event."
onid = "Optional row id on ontable."
medium = "Action to run (Do this action) — notify method."
person_id = "Who to notify."

[Pman.Tab.AdminNotifyRecur]
_description = "Recurring notification schedules (core_notify_recur). Editor is AdminNotifyRecur. Event-triggered watches are AdminWatches."

[Pman.Dialog.AdminNotifyRecur]
_description = "Create/edit a recurring notify schedule (days/hours, person, action). Not an event watch (AdminWatch)."
_args = "{ id: core_notify_recur id; 0 to create }"

[Pman.Tab.AdminNotifySender]
_description = "Notify from-addresses / pools (core_notify_sender). Catalog name may show as unnamed module; UI title is Notify Senders. Editor is AdminNotifySender."

[Pman.Dialog.AdminNotifySender]
_description = "Add/edit a notification sender (from email + pool). Not the mail server (CoreNotifyServer)."
_args = "{ id: core_notify_sender id; 0 to create }"

[Pman.Tab.CoreNotifyServers]
_description = "Outbound notification/mail servers (core_notify_server). Editor is CoreNotifyServer. Allocate an address with AdminAddIpv6."

[Pman.Dialog.CoreNotifyServer]
_description = "Add/edit an outbound notify/mail server (FQDN, pool, IPv6 range). Not a from-address (AdminNotifySender)."
_args = "{ id: core_notify_server id; 0 to create }"

[Pman.Dialog.AdminAddIpv6]
_description = "Allocate an IPv6 address (and optional PTR) for notify/mail. Opened from CoreNotifyServers. Domain is a ComboBox of core_domain."
_args = "{ }"

; --- Translations, settings, projects ---

[Pman.Tab.AdminSettings]
_description = "Column Manager — per-user/module grid column settings (core_person_window). Catalog name may show as unnamed module. Not staff account settings (AdminPerson /system-settings)."

[Pman.Tab.AdminTranslationsInt]
_description = "Languages and countries (I18n). Application string translations are AdminTranslations (child). Catalog title is Admin - AdminTranslationsInt."

[Pman.Tab.AdminTranslations]
_description = "Application UI string translations. Edit a row with AdminTranslateTemplates. Pick a target language with AdminLanguagePick (New). Not press-release / CRM copy."

[Pman.Dialog.AdminTranslateTemplates]
_description = "Edit one translation string. Keep {TEMPLATE_VARIABLE} tokens from the original. Open with the translation row id."
_args = "{ id: translation row id }"
txt = "Translated text. Must retain any {TEMPLATE_VARIABLE} from the original."

[Pman.Dialog.AdminLanguagePick]
_description = "Pick a language code (used when adding a translation). No row id. wait: true; the callback receives the language."
_args = "{ }"
_showExample = "show_dialog({ name: 'AdminLanguagePick', args: {}, wait: true })"

[Pman.Tab.AdminProjectManager]
_description = "core_project list. Editor is CoreProject (not an Admin* dialog). Members are AdminProjectMembers (south/child)."

[Pman.Tab.AdminProjectMembers]
_description = "People/companies on the selected project (core_project_directory). Requires a project row on AdminProjectManager."

[Pman.Dialog.AdminGenericName]
_description = "Generic single-field Name editor for an arbitrary Roo table. Do not use unless you already know _table. Requires args._table and args._title."
_args = "{ id, _table, _title }"
_table = "Required. Roo table / DataObject name (URL /Roo/{_table})."
_title = "Dialog title to show."

[Pman.Dialog.Login]
_description = "Do not open. Application login form — not an assistant action."
